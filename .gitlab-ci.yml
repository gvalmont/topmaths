# The Docker image that will be used to build your app
image: node:lts

# Functions that should be executed before the build script is run
before_script:
  - apt-get update && apt-get install -y curl zip  # Install curl and zip
  - npm ci
  - npm run makeJson
  - node tasks/build_prepare.js
  - ./node_modules/.bin/tsc -p tsconfig-tasks.json
  - node tmp/tasks/build_json.js
  - node tmp/tasks/build_pdf.js
  - ./node_modules/.bin/tsc -p tsconfig-tasks.json
  - node tmp/tasks/build_json.js

# Build the project and zip the dist/ folder
build:
  stage: build
  script:
    - npx vite build                # Build the project using Vite
    - du -sh dist/                  # Check the size of the dist folder
    - zip -9 -r dist.zip dist/ --exclude \*.map --exclude dist/static  # Zip the dist folder, excluding .map files and static folder
  artifacts:
    paths:
      - dist.zip                    # Upload the zipped dist folder as an artifact
  rules:
    # Only run this job for commits on the default branch
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

# Upload files to the FTP server
deploy:
  stage: deploy
  script:
    - curl -T dist.zip ftp://$FTP_URL/alloeva.topmaths.fr/ --user $FTP_USERNAME:$FTP_PASSWORD  # Upload using curl