stages:
- playwright-testInteractivity
- playwright-testConsistency
- playwright-test
- test
- build-projet
- playwright-test
- playwright-pdf
- playwright-pdfDNB
- playwright-pdfBAC

sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml


default:
  image: node:18.16.0
  cache:
    key:
      files:
      - pnpm-lock.yaml
    paths:
      - .pnpm-store

.install_dependencies:
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest-8 --activate
    - pnpm config set store-dir .pnpm-store
    - NODE_OPTIONS=--max-old-space-size=4096 pnpm install
    - nohup pnpm start &
    - sleep 20
    - until $(curl --output /dev/null --head --fail http://localhost:80/alea/); do printf '.'; sleep 10; done
    - sleep 60

.install_dependenciesPDF:
  before_script:
    - pnpm config set store-dir .pnpm-store
    - pnpm -v
    - lualatex -v
    - npm install playwright@1.44.0 --with-deps chromium
    - pnpm install
    - nohup pnpm start &
    - sleep 10
    - until $(curl --output /dev/null --head --fail http://localhost:80/alea/); do printf '.'; sleep 10; done
    - sleep 30
  
.install_dependenciesPDFDNB:
  before_script:
    - pnpm config set store-dir .pnpm-store
    - pnpm -v
    - lualatex -v
    - pnpm exec playwright@1.44.0 install --with-deps chromium
    - git clone https://forge.apps.education.fr/coopmaths/dnb.git ./public/static/dnb
    - pnpm install
    - nohup pnpm start &
    - sleep 10
    - until $(curl --output /dev/null --head --fail http://localhost:80/alea/); do printf '.'; sleep 10; done
    - sleep 30

.install_dependenciesPDFBAC:
  before_script:
    - pnpm config set store-dir .pnpm-store
    - pnpm -v
    - lualatex -v
    - pnpm exec playwright@1.44.0 install --with-deps chromium
    - git clone https://forge.apps.education.fr/coopmaths/bac.git ./public/static/bac
    - pnpm install
    - nohup pnpm start &
    - sleep 10
    - until $(curl --output /dev/null --head --fail http://localhost:80/alea/); do printf '.'; sleep 10; done
    - sleep 30

.testCIPDF:
  image: guironne/tex-live-nodejs-playwright8
  extends: .install_dependenciesPDF
  stage: playwright-pdf
  allow_failure: true
  rules:
  - if: $CI_COMMIT_BRANCH == "guironne-jobs"
    when: manual
  - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_TEST_MA == "PDF"
    when: always
  - when: never
  retry:
    max: 2
    when: 
    - runner_system_failure
    - script_failure
    - unknown_failure
  artifacts:
    when: always
    paths:
      - tests/e2e/logs
      - updatefile
    exclude:
      - updatefile/output/*.zip
    expire_in: 20 day

.testCI:
  extends: .install_dependencies
  image: mcr.microsoft.com/playwright:v1.43.0-jammy
  stage: playwright-test
  rules:
  - if: $CI_COMMIT_BRANCH == "main" && $CI_OPEN_MERGE_REQUESTS
    when: never
  - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
  - if: $CI_COMMIT_BRANCH == "guironne-jobs"
    when: manual
  - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_TEST_MA == "CONSOLE"
    when: always
  - when: never
  retry:
    max: 2
    when: 
    - runner_system_failure
    - script_failure
    - unknown_failure
  artifacts:
    when: always
    paths:
      - tests/e2e/logs
    expire_in: 10 day

build:
  extends: .testCI
  stage: build-projet
  script:
    - echo "CI_COMMIT_BRANCH '$CI_COMMIT_BRANCH'"
    - echo "CI_OPEN_MERGE_REQUESTS '$CI_OPEN_MERGE_REQUESTS'"
    - echo "CI_PIPELINE_SOURCE '$CI_PIPELINE_SOURCE'"
    - NODE_OPTIONS=--max-old-space-size=4096 pnpm build
    - echo "$CI_COMMIT_AUTHOR"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH == "guironne-jobs"
      when: always
    - when: never
  artifacts:
    when: on_failure
